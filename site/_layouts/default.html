<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="stylesheet" href="/assets/typo.css">
  <link rel="stylesheet" href="/assets/stormzhang.css">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="alternate" type="application/rss+xml" title="Research Notes" href="/rss.xml">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
</head>
<body>
<a class="skip-link" href="#main">跳至正文</a>
<div class="wrapper">
  <!-- Adapted from stormzhang's twitter/default.html navbar. -->
  <header class="navbar"><div class="navbar-inner row-fluid"><div class="span2"></div><div class="span8">
    <a class="brand" href="/"><span class="site-author">Kida</span><span class="site-title"> / Research Notes</span></a>
    <nav aria-label="主导航"><ul class="nav">
      <li><a href="/" {% if page.url == '/' %}aria-current="page"{% endif %}>首页</a></li>
      <li><a href="/archive/" {% if page.url == '/archive/' %}aria-current="page"{% endif %}>文章</a></li>
      <li><a href="/topics/" {% if page.url == '/topics/' %}aria-current="page"{% endif %}>专题</a></li>
      <li><a href="/about/" {% if page.url == '/about/' %}aria-current="page"{% endif %}>关于</a></li>
    </ul></nav>
  </div><div class="span2"></div></div></header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><span>Research Notes <span aria-hidden="true">·</span> 持续阅读，持续修订</span><div><a href="/rss.xml">RSS 订阅</a><a href="https://github.com/stormzhang/stormzhang.github.com">Theme origin ↗</a></div></footer>
</div>
</body>
</html>
